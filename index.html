<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electron</title>
<style>
* {
box-sizing: border-box;
}
html, body {
margin: 0;
width: 100%;
height: 100%;
background: white;
font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
font-weight: 300;
color: #222;
}
.electron {
width: 100%;
height: 100%;
display: flex;
flex-direction: column;
animation: swipeUp 0.8s ease-out;
}
.header {
padding: 50px 60px 20px;
}
.ring {
width: 80px;
height: 80px;
border: 7px solid #007aff;
border-radius: 50%;
margin-bottom: 25px;
}
.welcome {
font-size: 32px;
line-height: 1.35;
min-height: 45px;
opacity: 1;
transform: translateY(0);
transition:
opacity 0.3s ease,
transform 0.3s ease;
}
.welcome.swipe {
opacity: 0;
transform: translateY(-25px);
}
.welcome.swipe-in {
opacity: 1;
transform: translateY(25px);
}
.conversation {
flex: 1;
overflow-y: auto;
padding: 20px 60px 140px;
}
.message {
max-width: 750px;
margin-bottom: 28px;
animation: messageUp 0.35s ease-out;
}
.sender {
font-size: 17px;
color: #777;
margin-bottom: 5px;
}
.messageText {
font-size: 25px;
line-height: 1.4;
}
.searchLink {
color: #b38c00;
text-decoration: underline;
cursor: pointer;
}
.searchLink:hover {
color: #806500;
}
.timerDisplay {
font-size: 30px;
margin-top: 8px;
}
.thinking {
font-size: 22px;
color: #777;
animation: thinkingPulse 1.2s infinite;
}
.inputArea {
position: fixed;
bottom: 0;
left: 0;
width: 100%;
padding: 20px 60px 30px;
background: rgba(255,255,255,0.97);
}
.inputBox {
max-width: 900px;
display: flex;
align-items: center;
border-bottom: 1px solid #aaa;
}
input {
flex: 1;
border: none;
outline: none;
background: transparent;
font-family: inherit;
font-size: 21px;
font-weight: 300;
padding: 12px 0;
}
button {
border: none;
background: transparent;
font-family: inherit;
font-size: 18px;
cursor: pointer;
}
button:hover {
color: #b38c00;
}
@keyframes swipeUp {
from {
opacity: 0;
transform: translateY(70px);
}
to {
opacity: 1;
transform: translateY(0);
}
}
@keyframes messageUp {
from {
opacity: 0;
transform: translateY(15px);
}
to {
opacity: 1;
transform: translateY(0);
}
}
@keyframes thinkingPulse {
0%, 100% {
opacity: 0.45;
}
50% {
opacity: 1;
}
}
@media (max-width: 600px) {
.header {
padding: 30px 25px 10px;
}
.conversation {
padding-left: 25px;
padding-right: 25px;
}
.inputArea {
padding-left: 25px;
padding-right: 25px;
}
.ring {
width: 65px;
height: 65px;
}
.welcome {
font-size: 26px;
}
.messageText {
font-size: 22px;
}
}
</style>
</head>
<body>
<div class="electron">
<div class="header">
<div class="ring"></div>
<div id="welcome" class="welcome">
How can I help you?
</div>
</div>
<div id="conversation" class="conversation"></div>
<div class="inputArea">
<div class="inputBox">
<input
id="userInput"
type="text"
placeholder="Ask Electron..."
autocomplete="off"
>
<button onclick="askElectron()">
Send
</button>
</div>
</div>
</div>
<script>
/* =========================================
WAITING TEXT
========================================= */
const waitingMessages = [
"How can I help you?",
"Go ahead, Iâm listening.",
"You can type on the line below."
];
let waitingIndex = 0;
const welcome =
document.getElementById("welcome");
setInterval(() => {
welcome.classList.remove("swipe-in");
welcome.classList.add("swipe");
setTimeout(() => {
waitingIndex =
(waitingIndex + 1) %
waitingMessages.length;
welcome.textContent =
waitingMessages[waitingIndex];
welcome.classList.remove("swipe");
void welcome.offsetWidth;
welcome.classList.add("swipe-in");
}, 300);
}, 4000);
/* =========================================
USER MESSAGE
========================================= */
function addUserMessage(text) {
const conversation =
document.getElementById("conversation");
const message =
document.createElement("div");
message.className = "message";
message.innerHTML = `
<div class="sender">You</div>
<div class="messageText">
${escapeHTML(text)}
</div>
`;
conversation.appendChild(message);
scrollDown();
}
/* =========================================
ELECTRON MESSAGE
========================================= */
function addElectronMessage(text) {
const conversation =
document.getElementById("conversation");
const message =
document.createElement("div");
message.className = "message";
message.innerHTML = `
<div class="sender">Electron</div>
<div class="messageText">

}
/* =========================================
THINKING
========================================= */
function addThinking() {
const conversation =
document.getElementById("conversation");
const message =
document.createElement("div");

message.innerHTML = `
<div class="sender">Electron</div>
<div class="thinking">â¦</div>
`;
conversation.appendChild(message);

}
function removeThinking() {
const thinking =
document.getElementById("thinkingMessage");
if (thinking) {
thinking.remove();
}
}
/* =========================================
TIMER
========================================= */
let timerInterval = null;
let timerEndTime = null;
function startTimer(minutes) {
if (timerInterval) {
clearInterval(timerInterval);
}
timerEndTime =
Date.now() + (minutes * 60 * 1000);
const conversation =
document.getElementById("conversation");
const message =
document.createElement("div");
message.className = "message";
message.id = "timerMessage";
message.innerHTML = `
<div class="sender">Electron</div>
<div class="messageText">
Timer set for ${minutes}
minute${minutes === 1 ? "" : "s"}.
</div>
<div id="timerDisplay"
class="timerDisplay">
${minutes}:00
</div>
`;
conversation.appendChild(message);
scrollDown();
updateTimer();
timerInterval =
setInterval(updateTimer, 250);
}
function updateTimer() {
const remaining =
Math.max(
0,
timerEndTime - Date.now()
);
const totalSeconds =
Math.ceil(remaining / 1000);
const minutes =
Math.floor(totalSeconds / 60);
const seconds =
totalSeconds % 60;
const display =
document.getElementById("timerDisplay");
if (display) {
display.textContent =
minutes +
":" +
String(seconds).padStart(2, "0");
}
if (remaining <= 0) {
clearInterval(timerInterval);
timerInterval = null;
if (display) {
display.textContent = "0:00";
}
addElectronMessage(
"Your timer is done!"
);
if ("Notification" in window) {
if (
Notification.permission ===
"granted"
) {
new Notification("Electron", {
body:
"Your timer is done!"
});
} 
}
}
}
function cancelTimer() {
if (timerInterval) {
clearInterval(timerInterval);
timerInterval = null;
timerEndTime = null;
const timer =
document.getElementById(
"timerMessage"
);
if (timer) {
timer.remove();
}
addElectronMessage(
"Timer cancelled."
);
return true;
}
return false;
}
/* =========================================
RANDOM / FUN
========================================= */
function randomNumber() {
return Math.floor(
Math.random() * 100
) + 1;
}
/* =========================================
CALCULATOR
========================================= */
function calculateExpression(expression) {
try {
/*
Only allow numbers and basic
mathematical operators.
*/
if (!/^[0-9+\-*/().%\s]+$/.test(expression)) {
return null;
}
const result =
Function(
'"use strict"; return (' +
expression.replace(
/%/g,
"/100"
) +
")"
)();
if (
typeof result !== "number" ||
!isFinite(result)
) {
return null;
}
return result;
} catch {
return null;
}
}

}
/* ================================
DATE
================================= */
if (

/* ================================
MONTH
================================= */
if (
command === "what month is it" ||

) {

YEAR

if (

TIME

if (
command.includes("what time is it") ||

) {

new Date();

const timerMatch =

if (

if (

========================================= */
async function electronWikipedia(query) {
try {
const url =
"https://en.wikipedia.org/api/rest_v1/page/summary/" +
encodeURIComponent(query);
const response =
await fetch(url);
if (!response.ok) {
throw new Error();
}
const data =
await response.json();
if (data.extract) {
let answer =
data.extract;
if (answer.length > 700) {
answer =
answer.substring(0, 700) +
"...";
}
addElectronMessage(
answer +
"<br><br>" +
'<a class="searchLink" href="' +
data.content_urls.desktop.page +
'" target="_blank">' +
"Read more on Wikipedia" +
"</a>"
);
return true;
}
} catch (error) {
return false;
}
return false;
}

/* =========================================
SMART MATH
========================================= */
function electronSmartMath(command) {
let expression = command;
expression =
expression
.replace(/\bwhat is\b/g, "")
.replace(/\bcalculate\b/g, "")
.replace(/\bplus\b/g, "+")
.replace(/\bminus\b/g, "-")
.replace(/\btimes\b/g, "*")
.replace(/\bmultiplied by\b/g, "*")
.replace(/\bdivided by\b/g, "/")
.replace(/\bto the power of\b/g, "**")
.replace(/\bpercent of\b/g, "*")
.trim();
if (
!/[0-9]/.test(expression)
) {
return false;
}
const result =
calculateExpression(expression);
if (result !== null) {
addElectronMessage(
"The answer is " +
result +
"."
);
return true;
}
return false;
}
/* =========================================
UNIT CONVERSIONS
========================================= */
function electronConversion(command) {
let match;
/* MILES â KILOMETERS */
match =
command.match(
/([\d.]+)\s*(miles?|mi)\s*(?:to|in)\s*(kilometers?|km)/
);
if (match) {
const value =
parseFloat(match[1]);
const result =
value * 1.609344;
addElectronMessage(
value +
" miles is " +
result.toFixed(2) +
" kilometers."
);
return true;
}
/* KILOMETERS â MILES */
match =
command.match(
/([\d.]+)\s*(kilometers?|km)\s*(?:to|in)\s*(miles?|mi)/
);
if (match) {
const value =
parseFloat(match[1]);
const result =
value / 1.609344;
addElectronMessage(
value +
" kilometers is " +
result.toFixed(2) +
" miles."
);
return true;
}
/* FAHRENHEIT â CELSIUS */
match =
command.match(
/([\d.]+)\s*(?:degrees?\s*)?(fahrenheit|Â°f)\s*(?:to|in)\s*(celsius|Â°c)/
);
if (match) {
const value =
parseFloat(match[1]);
const result =
(value - 32) * 5 / 9;
addElectronMessage(
value +
"Â°F is " +
result.toFixed(1) +
"Â°C."
);
return true;
}
/* CELSIUS â FAHRENHEIT */
match =
command.match(
/([\d.]+)\s*(?:degrees?\s*)?(celsius|Â°c)\s*(?:to|in)\s*(fahrenheit|Â°f)/
);
if (match) {
const value =
parseFloat(match[1]);
const result =
(value * 9 / 5) + 32;
addElectronMessage(
value +
"Â°C is " +
result.toFixed(1) +
"Â°F."
);
return true;
}
/* POUNDS â KILOGRAMS */
match =
command.match(
/([\d.]+)\s*(pounds?|lbs?)\s*(?:to|in)\s*(kilograms?|kg)/
);
if (match) {
const value =
parseFloat(match[1]);
const result =
value * 0.45359237;
addElectronMessage(
value +
" pounds is " +
result.toFixed(2) +
" kilograms."
);
return true;
}
/* KILOGRAMS â POUNDS */
match =
command.match(
/([\d.]+)\s*(kilograms?|kg)\s*(?:to|in)\s*(pounds?|lbs?)/
);
if (match) {
const value =
parseFloat(match[1]);
const result =
value / 0.45359237;
addElectronMessage(
value +
" kilograms is " +
result.toFixed(2) +
" pounds."
);
return true;
}
return false;
}
/* =========================================
DATE CALCULATIONS
========================================= */
function electronDaysUntil(command) {
const match =
command.match(
/how many days (?:until|till|until)\s+(.+)/
);
if (!match) {
return false;
}
const target =
new Date(match[1]);
if (isNaN(target.getTime())) {
return false;
}
const today =
new Date();
today.setHours(0,0,0,0);
target.setHours(0,0,0,0);
const difference =
Math.ceil(
(target - today) /
86400000
);
if (difference < 0) {
addElectronMessage(
"That date has already passed."
);
} else if (difference === 0) {
addElectronMessage(
"That date is today! âï¸"
);
} else if (difference === 1) {
addElectronMessage(
"That date is tomorrow!"
);
} else {
addElectronMessage(
"There are " +
difference +
" days until " +
target.toLocaleDateString(
undefined,
{
month: "long",
day: "numeric",
year: "numeric"
}
) +
"."
);
}
return true;
}
/* =========================================
SMART SEARCH COMMANDS
========================================= */
async function electronSmartCommand(text) {
const command =
text.toLowerCase().trim().replace(/[?!.,]+$/, "").trim();
/* WEATHER */
if (
command === "weather" ||
command === "what's the weather" ||
command === "what is the weather" ||
command.includes("weather today") ||
command.includes("weather right now") ||
command.includes("how is the weather")
) {
return await electronWeather();
}
/* WIKIPEDIA */
if (
command.startsWith("who is ") ||
command.startsWith("what is ") ||
command.startsWith("tell me about ")
) {
let query = null;
if (
command.startsWith("who is ")
) {
query =
text.substring(7).trim();
}
else if (
command.startsWith("tell me about ")
) {
query =
text.substring(14).trim();
}
else if (
command.startsWith("what is ")
) {
query =
text.substring(8).trim();
}
/*
Don't intercept existing simple
math questions.
*/
if (
query &&
!/^[0-9+\-*/().%\s]+$/.test(query) &&
!/[0-9]/.test(query)
) {
const found =
await electronWikipedia(query);
if (found) {
return true;
}
}
}
/* UNIT CONVERSION */
if (
electronConversion(command)
) {
return true;
}
/* DAYS UNTIL */
if (
electronDaysUntil(command)
) {
return true;
}
/* SEARCH THE WEB */
if (
command.startsWith("search for ") ||
command.startsWith("search the web for ") ||
command.startsWith("google ") ||
command.startsWith("look up ") ||
command.startsWith("find ")
) {
let query = text;
query =
query
.replace(/^search for\s+/i, "")
.replace(/^search the web for\s+/i, "")
.replace(/^google\s+/i, "")
.replace(/^look up\s+/i, "")
.replace(/^find\s+/i, "")
.trim();
if (query) {
electronWebSearch(query);
return true;
}
}
/* OPEN GOOGLE */
if (
command === "open google"
) {
window.open(
"https://www.google.com",
"_blank"
);
addElectronMessage(
"Opening Google."
);
return true;
}
/* OPEN YOUTUBE */
if (
command === "open youtube"
) {
window.open(
"https://www.youtube.com",
"_blank"
);
addElectronMessage(
"Opening YouTube."
);
return true;
}
/* OPEN WIKIPEDIA */
if (
command === "open wikipedia"
) {
window.open(
"https://www.wikipedia.org",
"_blank"
);
addElectronMessage(
"Opening Wikipedia."
);
return true;
}
/* TIME IN ANOTHER PLACE */
const timeMatch =
command.match(
/what time is it in (.+)/
);
if (timeMatch) {
const place =
timeMatch[1];
electronWebSearch(
"current time in " + place
);
return true;
}
/* SMART MATH */
if (
command.startsWith("calculate ") ||
(
command.startsWith("what is ") &&
/[0-9]/.test(command)
)
) {
if (
electronSmartMath(command)
) {
return true;
}
}
/* UNKNOWN */
return false;
}

/* =========================================
AI BRAIN (runs in the browser, free, no key)
Uses WebLLM. The first AI answer downloads the model
(~0.9 GB, cached after that). Needs WebGPU
(recent Chrome, Edge, or Safari). Otherwise falls
back to the old web-search reply.
========================================= */
const AI_MODEL = "Llama-3.2-1B-Instruct-q4f16_1-MLC";
let aiEngine = null;
let aiLoading = null;
const aiHistory = [
  { role: "system", content: "You are Electron, a friendly personal assistant made in New York. Keep answers short: one to three sentences." }
];
function webSearchReply(text) {
  addElectronMessage(
    "I found something that may help: " +
    '<a class="searchLink" href="https://www.google.com/search?q=' +
    encodeURIComponent(text) + '" target="_blank">' +
    "click here to see what I found on the web for â" + escapeHTML(text) + "â</a>."
  );
}
async function loadAI() {
  if (aiEngine) return aiEngine;
  if (!aiLoading) {
    aiLoading = (async () => {
      const webllm = await import("https://esm.run/@mlc-ai/web-llm");
      aiEngine = await webllm.CreateMLCEngine(AI_MODEL, {
        initProgressCallback: (p) => {
          const t = document.querySelector("#thinkingMessage .thinking");
          if (t) t.textContent = "Waking up my brainâ¦ " + Math.round((p.progress || 0) * 100) + "%";
        }
      });
      return aiEngine;
    })();
  }
  return aiLoading;
}
async function askAI(text) {
  if (!navigator.gpu) { addElectronMessage("(My AI brain needs WebGPU, which this browser doesn't have. Try Chrome or Edge on a computer.)"); webSearchReply(text); return; }
  addThinking();
  try {
    const engine = await loadAI();
    aiHistory.push({ role: "user", content: text });
    const reply = await engine.chat.completions.create({ messages: [aiHistory[0], ...aiHistory.slice(1).slice(-8)], max_tokens: 200 });
    const answer = reply.choices[0].message.content.trim();
    aiHistory.push({ role: "assistant", content: answer });
    removeThinking();
    addElectronMessage(escapeHTML(answer));
  } catch (e) {
    console.error(e);
    aiLoading = null;
    removeThinking();
    addElectronMessage("(My AI brain couldn't start: " + escapeHTML(String(e && e.message || e)) + ")");
    webSearchReply(text);
  }
}
