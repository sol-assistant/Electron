html, body {

color: #222;

button {

background: transparent;
font-family: inherit;
font-size: 18px;
cursor: pointer;
padding: 10px 0 10px 18px;
color: #333;
}

button:hover {

input:focus-visible,

from {
opacity: 0;
transform: translateY(70px);
}
to {
opacity: 1;
transform: translateY(0);
}
}

@keyframes messageUp {
from {
opacity: 0;
transform: translateY(15px);
}
to {
opacity: 1;
transform: translateY(0);
}
}

@keyframes thinkingPulse {
0%, 100% { opacity: 0.45; }
50% { opacity: 1; }
}

@media (max-width: 600px) {

.conversation {

.ring {

const waitingMessages = [

function scrollDown() {

/* Electron's voice: a US English man's voice */
const MALE_US_VOICES = ["aaron", "fred", "alex", "evan", "nathan", "tom", "reed", "rocko", "eddy", "microsoft david", "microsoft guy", "microsoft mark", "microsoft andrew", "microsoft brian", "microsoft christopher", "microsoft eric", "microsoft roger", "microsoft steffan", "google us english male"];

function pickElectronVoice() {
const voices = speechSynthesis.getVoices().filter(v =>
(v.lang || "").replace("_", "-").toLowerCase().startsWith("en-us")
);
for (const name of MALE_US_VOICES) {
const match = voices.find(v => v.name.toLowerCase().includes(name));
if (match) return match;
}
return null;
}

if ("speechSynthesis" in window) {
speechSynthesis.getVoices();
speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
}

/* Read a message out loud (built into the browser, free) */
function speakText(text, button) {
if (!("speechSynthesis" in window)) {
alert("Sorry, this browser can't read out loud.");
return;
}
const wasSpeaking = button.classList.contains("speaking");
speechSynthesis.cancel();
document.querySelectorAll(".speakButton.speaking").forEach(b => {
b.classList.remove("speaking");
b.textContent = "\u{1F50A}";
});
if (wasSpeaking) return;
const utterance = new SpeechSynthesisUtterance(text);
utterance.lang = "en-US";
const voice = pickElectronVoice();
if (voice) {
utterance.voice = voice;
} else {
utterance.pitch = 0.8; /* no male US voice found: lower the default */
}
utterance.onend = utterance.onerror = () => {
button.classList.remove("speaking");
button.textContent = "\u{1F50A}";
};
button.classList.add("speaking");
button.textContent = "\u23F9";
speechSynthesis.speak(utterance);
}

function createMessage(sender) {
const message = document.createElement("div");
message.className = "message";

const senderElement = document.createElement("div");
senderElement.className = "sender";
senderElement.textContent = sender;

const textElement = document.createElement("div");

message.append(senderElement, textElement);

if (sender === "Electron") {

speakButton.className = "speakButton";
speakButton.type = "button";
speakButton.textContent = "\u{1F50A}";
speakButton.title = "Read out loud";
speakButton.addEventListener("click", () => speakText(textElement.textContent, speakButton));
message.appendChild(speakButton);
}

conversation.appendChild(message);

return { message, textElement };
}

function addUserMessage(text) {
const { textElement } = createMessage("You");

/* =========================================
NORMALIZE COMMANDS
========================================= */

function normalize(text) {
return text
.toLocaleLowerCase()
.trim()
.replace(/[?!.,]+$/g, "")
.trim()
.replace(/\s+/g, " ");
}

/* =========================================
RANDOM NUMBER
========================================= */

function randomNumber() {
return Math.floor(Math.random() * 100) + 1;
}

/* =========================================
CALCULATOR
========================================= */

function calculateExpression(expression) {
const cleaned = expression
.replace(/,/g, "")
.trim();

if (!cleaned || cleaned.length > 100) {
return null;
}

/*
Permit only numeric arithmetic characters.
The expression is evaluated only after this
strict character check.
*/

if (!/^[0-9+\-*/().%\s]+$/.test(cleaned)) {
return null;
}

/*
Convert percentage values such as 50% into
50/100. This supports simple percentages,
not every possible interpretation of %.
*/

const converted = cleaned.replace(
/(\d+(?:\.\d+)?)\s*%/g,
"($1/100)"
);

try {
const result = Function(
'"use strict"; return (' + converted + ');'
)();

if (
typeof result !== "number" ||
!Number.isFinite(result)
) {
return null;
}

return Number(
result.toPrecision(12)
);
} catch {
return null;
}
}

function tryMath(command) {
let expression = command;

expression = expression
.replace(/^calculate\s+/i, "")
.replace(/^what is\s+/i, "")
.replace(/^what's\s+/i, "")
.replace(/\bplus\b/gi, "+")
.replace(/\bminus\b/gi, "-")
.replace(/\btimes\b/gi, "*")
.replace(/\bmultiplied by\b/gi, "*")
.replace(/\bdivided by\b/gi, "/")
.replace(/\bx\b/gi, "*")
.trim();

if (!/[0-9]/.test(expression)) {
return false;
}

const result = calculateExpression(expression);

if (result === null) {
return false;
}

addElectronMessage("The answer is " + result + ".");
return true;
}

/* =========================================
TIMER
========================================= */

function startTimer(minutes) {
if (timerInterval) {
clearInterval(timerInterval);
timerInterval = null;
}

const oldTimer =
document.getElementById("timerMessage");

if (oldTimer) {
oldTimer.remove();
}

timerEndTime =
Date.now() + minutes * 60 * 1000;

const { message, textElement } =
createMessage("Electron");

message.id = "timerMessage";

textElement.textContent =
"Timer set for " +
minutes +
" minute" +
(minutes === 1 ? "" : "s") +
".";

const display = document.createElement("div");
display.id = "timerDisplay";
display.className = "timerDisplay";
display.textContent = minutes + ":00";

message.appendChild(display);
scrollDown();

updateTimer();
timerInterval = setInterval(updateTimer, 250);
}

function updateTimer() {
if (timerEndTime === null) {
return;
}

const remaining =
Math.max(0, timerEndTime - Date.now());

const totalSeconds =
Math.ceil(remaining / 1000);

const minutes =
Math.floor(totalSeconds / 60);

const seconds =
totalSeconds % 60;

const display =
document.getElementById("timerDisplay");

if (display) {
display.textContent =
minutes + ":" +
String(seconds).padStart(2, "0");
}

if (remaining <= 0) {
clearInterval(timerInterval);
timerInterval = null;
timerEndTime = null;

if (display) {
display.textContent = "0:00";
}

addElectronMessage("Your timer is done!");

if ("Notification" in window) {
if (Notification.permission === "granted") {
new Notification("Electron", {
body: "Your timer is done!"
});
}
}
}
}

function cancelTimer() {
if (!timerInterval) {
return false;
}

clearInterval(timerInterval);
timerInterval = null;
timerEndTime = null;

const timer =
document.getElementById("timerMessage");

if (timer) {
timer.remove();
}

addElectronMessage("Timer cancelled.");
return true;
}

function tryConversion(command) {
let match;
let value;
let result;

match = command.match(
/([\d.]+)\s*(miles?|mi)\s*(?:to|in)\s*(kilometers?|km)/
);

if (match) {
value = Number(match[1]);
result = value * 1.609344;

addElectronMessage(
value + " miles is " +
result.toFixed(2) + " kilometers."
);

return true;
}

match = command.match(
/([\d.]+)\s*(kilometers?|km)\s*(?:to|in)\s*(miles?|mi)/
);

if (match) {
value = Number(match[1]);
result = value / 1.609344;

addElectronMessage(
value + " kilometers is " +
result.toFixed(2) + " miles."
);

return true;
}

match = command.match(
/([\d.]+)\s*(?:degrees?\s*)?(?:fahrenheit|Â°f)\s*(?:to|in)\s*(?:celsius|Â°c)/
);

if (match) {
value = Number(match[1]);
result = (value - 32) * 5 / 9;

addElectronMessage(
value + "Â°F is " +
result.toFixed(1) + "Â°C."
);

return true;
}

match = command.match(
/([\d.]+)\s*(?:degrees?\s*)?(?:celsius|Â°c)\s*(?:to|in)\s*(?:fahrenheit|Â°f)/
);

if (match) {
value = Number(match[1]);
result = value * 9 / 5 + 32;

addElectronMessage(
value + "Â°C is " +
result.toFixed(1) + "Â°F."
);

return true;
}

match = command.match(
/([\d.]+)\s*(pounds?|lbs?)\s*(?:to|in)\s*(kilograms?|kg)/
);

if (match) {
value = Number(match[1]);
result = value * 0.45359237;

addElectronMessage(
value + " pounds is " +
result.toFixed(2) + " kilograms."
);

return true;
}

match = command.match(
/([\d.]+)\s*(kilograms?|kg)\s*(?:to|in)\s*(pounds?|lbs?)/
);

if (match) {
value = Number(match[1]);
result = value / 0.45359237;

addElectronMessage(
value + " kilograms is " +
result.toFixed(2) + " pounds."
);

return true;
}

match = command.match(
/([\d.]+)\s*(inches?|in)\s*(?:to|in)\s*(centimeters?|cm)/
);

if (match) {
value = Number(match[1]);
result = value * 2.54;

addElectronMessage(
value + " inches is " +
result.toFixed(2) + " centimeters."
);

return true;
}

match = command.match(
/([\d.]+)\s*(centimeters?|cm)\s*(?:to|in)\s*(inches?|in)/
);

if (match) {
value = Number(match[1]);
result = value / 2.54;

addElectronMessage(
value + " centimeters is " +
result.toFixed(2) + " inches."
);

return true;
}

return false;
}

/* =========================================
WIKIPEDIA LOOKUP
========================================= */

async function wikipediaSearch(query) {
const url =
"https://en.wikipedia.org/w/api.php" +
"?action=query" +
"&list=search" +
"&format=json" +
"&origin=*" +
"&srlimit=1" +
"&srsearch=" + encodeURIComponent(query);

const response = await fetch(url);

if (!response.ok) {
throw new Error("Wikipedia search failed");
}

const data = await response.json();
const hit = data.query?.search?.[0];

if (!hit) {
throw new Error("No Wikipedia result");
}

const summaryUrl =
"https://en.wikipedia.org/api/rest_v1/page/summary/" +
encodeURIComponent(hit.title.replace(/ /g, "_"));

const summaryResponse = await fetch(summaryUrl);

if (!summaryResponse.ok) {
throw new Error("Wikipedia summary unavailable");
}

const page = await summaryResponse.json();

if (!page.extract) {
throw new Error("No summary available");
}

const sentences = page.extract
.split(/(?<=[.!?])\s+/)
.slice(0, 3)
.join(" ");

addElectronRichMessage([
{
type: "text",
text: sentences + "\n\n"
},
{
type: "link",
label: "Read more on Wikipedia",
url: page.content_urls?.desktop?.page ||
"https://en.wikipedia.org/wiki/" +
encodeURIComponent(hit.title.replace(/ /g, "_"))
}
]);
}

/* =========================================
DAYS UNTIL A DATE
========================================= */

function tryDaysUntil(command) {
const match = command.match(
/^how many days (?:until|till)\s+(.+)$/
);

if (!match) {
return false;
}

const target = new Date(match[1]);

if (Number.isNaN(target.getTime())) {
return false;
}

const today = new Date();
today.setHours(0, 0, 0, 0);
target.setHours(0, 0, 0, 0);

const difference = Math.round(
(target - today) / 86400000
);

if (difference < 0) {
addElectronMessage("That date has already passed.");
} else if (difference === 0) {
addElectronMessage("That date is today! âï¸");
} else if (difference === 1) {
addElectronMessage("That date is tomorrow!");
} else {
addElectronMessage(
"There are " + difference +
" days until " +
target.toLocaleDateString(undefined, {
month: "long",
day: "numeric",
year: "numeric"
}) + "."
);
}

return true;
}

"Content-Type": "application/json"
},
body: JSON.stringify({
messages: aiHistory
})
});

const data = await response.json();

if (
!response.ok ||
!data.answer ||
typeof data.answer !== "string"
) {
throw new Error(
data.error || "The AI service did not return an answer."
);
}

if (currentRequest !== requestNumber) {
return;
}

aiHistory.push({
role: "assistant",
content: data.answer
});

aiHistory = aiHistory.slice(-8);

removeThinking();
addElectronMessage(data.answer);

} catch (error) {
if (currentRequest !== requestNumber) {
return;
}

console.error("Electron AI error:", error);

if (aiHistory.length > 0 &&
aiHistory[aiHistory.length - 1].role === "user") {
aiHistory.pop();
}

removeThinking();

try {
addThinking();
await wikipediaSearch(text);
removeThinking();
} catch {
removeThinking();
webSearchReply(text);
}
}
}

if (

command === "list of commands" ||
command === "command list" ||

command === "show me the commands" ||

) {

return true;
}

/* DATE & TIME */

if (
command === "date" ||
command === "today" ||
command.includes("what's the date") ||
command.includes("what is the date") ||
command.includes("what day is it") ||
command.includes("what day is today")
) {
addElectronMessage("Today is " + getDate() + ".");
return true;
}

if (
command === "what month is it" ||
command === "what month is this"
) {
addElectronMessage(
"Itâs " +
new Date().toLocaleDateString(undefined, {
month: "long"
}) + "."
);
return true;
}

if (
command === "what year is it" ||
command === "what year is this"
) {
addElectronMessage(
"Itâs " + new Date().getFullYear() + "."
);
return true;
}

if (
command === "time" ||
command.includes("what time is it") ||
command.includes("what's the time") ||
command.includes("what is the time")
) {
addElectronMessage("Itâs " + getTime() + ".");
return true;
}

/* TIMERS */

const timerMatch = command.match(
/^(?:set\s+)?(?:a\s+)?timer(?:\s+for)?\s+(\d+)\s*(minutes?|mins?|m)$/
);

if (timerMatch) {
const minutes = Number(timerMatch[1]);

if (minutes >= 1 && minutes <= 5) {
startTimer(minutes);
} else {
addElectronMessage(

);
}

}

if (
command === "stop" ||
command === "cancel" ||
command === "cancel timer" ||
command === "stop timer"
) {
if (!cancelTimer()) {

}
return true;
}

/* GREETINGS BY TIME OF DAY */

if (command === "good morning") {
addElectronMessage("Good morning! âï¸");

}

addElectronMessage("Good afternoon!");
return true;
}

return true;
}

}

}

) {

}

/* JOKES */

/* FUN */

if (

) {

);
return true;
}

if (command === "surprise me") {

);

}

if (

) {

}

if (

command === "roll the dice"
) {

);

}

if (

);

if (

) {

}

if (command === "entertain me") {

);
return true;

/* PERSONALITY */

if (command === "do you like me") {

}

if (command === "are you my assistant") {

);

/* VERSION */

if (

) {

);
return true;
}

/* WEATHER */

if (
command === "weather" ||

command.includes("how is the weather")
) {

}

/* UNIT CONVERSIONS */

if (tryConversion(command)) {
return true;
}

/* DAYS UNTIL */

if (tryDaysUntil(command)) {
return true;
}

/* MATH */

if (
command.startsWith("calculate ") ||
command.startsWith("what is ") ||
command.startsWith("what's ")
) {
if (tryMath(command)) {
return true;
}
}

/* WEB SEARCH */

const searchPrefixes = [
"search the web for ",
"search for ",
"google ",
"look up ",
"find "
];

for (const prefix of searchPrefixes) {
if (command.startsWith(prefix)) {

if (query) {

}

}
}

/* OPEN WEBSITES */

const websites = {

};

if (websites[command]) {

);

);

/* TIME IN ANOTHER PLACE */

);

/* WIKIPEDIA QUESTIONS */

let wikiQuery = null;

/* =========================================
SEND MESSAGE
========================================= */

async function askElectron() {
const text = input.value.trim();

if (!text) {
return;
}

input.value = "";
input.focus();

requestNumber++;
const currentRequest = requestNumber;

addUserMessage(text);
addThinking();

try {
removeThinking();
await handleCommand(text, currentRequest);
} catch (error) {
console.error("Electron command error:", error);
removeThinking();

addElectronMessage(
"Something went wrong while processing that request. Please try again."
);
}
}

/* =========================================

document
